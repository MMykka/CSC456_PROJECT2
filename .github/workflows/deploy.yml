# CI/CD pipeline
# Every push to the "main" branch on GitHub:
#   1. (CI) installs dependencies and runs the tests
#   2. (CD) if the tests pass, tells Render to redeploy the app using a Deploy Hook
name: CI/CD - Test and Deploy to Render

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret

  deploy:
    needs: test # only deploy if tests passed
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
